name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Build (but do not deploy) on pull requests that touch the docs site, so a
  # change to doc/package-lock.json is proven to still `npm ci` and build
  # before it reaches master. Without this, nothing in CI ever installs or
  # builds doc/ on a PR -- the unittest workflow only covers the Django API.
  pull_request:
    branches: [master]
    paths:
      - 'doc/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep one deploy at a time on master, but give each pull request its own
  # group so a docs PR build never queues behind (or blocks) a real deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: doc/package-lock.json

      - name: Install dependencies
        working-directory: doc
        run: npm ci

      - name: Build the site
        working-directory: doc
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/public

  deploy:
    needs: build
    # Pull requests only get the build job above; deploying to Pages stays
    # restricted to master and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
