# These volumes must be created before running `docker compose up` -- they
# are external, so compose will not create them for you.
volumes:
  # docker volume create --name gws-code --opt type=none --opt device=/THE-ABSOLUTE-PATH-TO-YOUR-CURRENT-WORKING-DIRECTORY/gplates-web-service.git --opt o=bind
  gws-code:
    external: true
    name: gws-code
  # Recommended: a plain Docker-managed volume (avoids host/container UID
  # mismatches -- see docker/notes.md):
  #   docker volume create --name gplates-db-data
  # Alternative: bind-mount a host folder instead, if you need direct
  # host-filesystem access to the DB files for inspection/backup:
  #   mkdir gplates-db-data
  #   docker volume create --name gplates-db-data --opt type=none --opt device=/THE-ABSOLUTE-PATH-TO-YOUR-CURRENT-WORKING-DIRECTORY/gplates-db-data --opt o=bind
  gplates-db-data:
    external: true
    name: gplates-db-data

services:
  gplates-postgis:
    image: gplates/postgis
    hostname: gplates-postgis
    volumes:
      - gplates-db-data:/var/lib/postgresql/18/main
    networks:
      - gplates-net
    restart: on-failure
    healthcheck:
      test: pg_isready -U gplates -d gplates
      interval: 1m30s
      timeout: 10s
      retries: 3

  gws:
    image: gplates/gws
    hostname: gws
    container_name: docker-gws
    volumes:
       - gws-code:/gws
    networks:
      - gplates-net
    depends_on:
      - gplates-postgis
      - gplates-redis
    ports:
      - 18000:80
    restart: on-failure
    healthcheck:
      test: curl --fail -s "http://localhost:80/raster/query?lon=128.86&lat=-12.42&raster_name=crustal_thickness" || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
  
  gplates-redis:
    image: redis
    hostname: gplates-redis
    networks:
      - gplates-net
    restart: unless-stopped
    healthcheck:
      test: redis-cli -h gplates-redis ping  
      interval: 1m30s
      timeout: 10s
      retries: 3

# Also external -- create before running `docker compose up`:
#   docker network create --driver bridge gplates-net
networks:
  gplates-net:
    name: gplates-net
    driver: bridge
    external: true

