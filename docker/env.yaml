name: gplately-env-for-docker
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - gplately
  - jupyter
  - moviepy>=2.0.0
  - gmt
  - pygmt
  - stripy
  - setuptools-git-versioning
  - git
  - cmcrameri
  - openpyxl
  # GWS Django app dependencies -- installed via conda-forge (not pip) so
  # they land in this same environment and so GDAL/Cartopy/PROJ/GEOS come
  # from conda-forge's matched binary builds instead of mixing with any
  # system/apt copies.
  - django
  - djangorestframework
  - uritemplate
  - numpy
  - pandas
  - scipy
  - healpy
  - requests
  - netcdf4
  - pyshp
  - psycopg2
  - cartopy
  - gdal
  - pyopenssl
  - python-dotenv
  - tzdata
  - redis-py
  - inflection
  - geoserver-rest
  # mod_wsgi is intentionally NOT listed here -- it needs to be compiled
  # from source against the Apache installed in the image (see Dockerfile),
  # so it's installed separately with `pip install mod_wsgi` after this
  # environment is created.
  # plate-model-manager is also intentionally left out -- the Dockerfile
  # pip-installs it with --upgrade so the image always gets the latest
  # release at build time.
