# Do not advertise the Apache version and the OS. Without these, the responses
# carry "Server: Apache/2.4.52 (Ubuntu)" and the generated error pages repeat
# it in their footer. "Prod" trims the header down to "Server: Apache";
# Apache cannot drop the Server header altogether without mod_security.
# This file is symlinked into sites-enabled, which Apache includes after
# conf-enabled, so these override the "ServerTokens OS" in Ubuntu's own
# conf-enabled/security.conf.
ServerTokens Prod
ServerSignature Off

# Disable the TRACE method (cross-site tracing). GWS never needs it.
TraceEnable Off

ServerName  gws.gplates.org
WSGIPythonPath /gws/django/GWS
<VirtualHost *:80>
    ServerName  gws.gplates.org
    ServerAdmin michael.chin@sydney.edu.au
    Alias /static /var/www/html/static/
    <Directory /gws/django/GWS/GWS>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    
    WSGIDaemonProcess gws.gplates.org processes=2 threads=15 display-name=%{GROUP}
    WSGIProcessGroup gws.gplates.org
    WSGIApplicationGroup %{GLOBAL}


    WSGIScriptAlias / /gws/django/GWS/GWS/wsgi.py
</VirtualHost>

