# Host-level Apache reverse proxy for running GWS versions side by side.
# See docker/versioning/README.md and GitHub issue #24.
#
# Needs: a2enmod proxy proxy_http headers
#
# Each container serves its own /vN/ prefix (e.g. the v1 image answers both
# /reconstruct/... and /v1/reconstruct/...), so paths are passed through
# unchanged. Use internal proxying, never 301/302 redirects: API clients often
# don't follow them and POST bodies can be lost.
#
# Apache uses the FIRST matching ProxyPass, so keep the catch-all "/" last.

<VirtualHost *:80>
    ServerName gws.gplates.org

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # explicit versions
    # ProxyPass        /v2/ http://127.0.0.1:18002/v2/
    # ProxyPassReverse /v2/ http://127.0.0.1:18002/v2/
    ProxyPass        /v1/ http://127.0.0.1:18001/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:18001/v1/

    # unversioned URLs = the default version (v1 until the deprecation period
    # ends; then change 18001 -> 18002 here and reload Apache)
    ProxyPass        /    http://127.0.0.1:18001/
    ProxyPassReverse /    http://127.0.0.1:18001/
</VirtualHost>
