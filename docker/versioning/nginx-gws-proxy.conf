# Host-level nginx reverse proxy for running GWS versions side by side.
# Equivalent to apache-gws-proxy.conf. See docker/versioning/README.md and
# GitHub issue #24.
#
# Each container serves its own /vN/ prefix, so paths are passed through
# unchanged (proxy_pass without a URI part). Internal proxying, never
# redirects. nginx picks the longest matching prefix, so order doesn't matter.

upstream gws_v1 { server 127.0.0.1:18001; }
# upstream gws_v2 { server 127.0.0.1:18002; }

server {
    listen 80;
    server_name gws.gplates.org;

    client_max_body_size 100m;  # file uploads (reconstruct_files etc.)

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # explicit versions
    # location /v2/ { proxy_pass http://gws_v2; }
    location /v1/ { proxy_pass http://gws_v1; }

    # unversioned URLs = the default version (v1 until the deprecation period
    # ends; then point this at gws_v2 and reload nginx)
    location / { proxy_pass http://gws_v1; }
}
